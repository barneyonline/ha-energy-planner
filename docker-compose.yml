services:
  ha-runtime:
    profiles: [manual]
    image: ${HEP_HA_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.10.0}
    container_name: ha-energy-planner-runtime
    volumes:
      - ./docker/homeassistant/config:/config
      - ./custom_components/ha_energy_planner:/config/custom_components/ha_energy_planner:ro
    environment:
      - TZ=Australia/Melbourne
      - PYTHONPATH=/config/deps
    ports:
      - "127.0.0.1:8124:8123"
    restart: "no"
