name: Tests

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow_ref || github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      pytest: ${{ steps.select.outputs.pytest }}
      quality_scale: ${{ steps.select.outputs.quality_scale }}
      validation_extras: ${{ steps.select.outputs.validation_extras }}
      dedicated_quality_scale: ${{ steps.select.outputs.dedicated_quality_scale }}
      ha_matrix: ${{ steps.select.outputs.ha_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for this change set
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-renames --name-only --diff-filter=ACDMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            python3 scripts/select_ci_checks.py --paths-file "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/select_ci_checks.py --all >> "$GITHUB_OUTPUT"
          fi
          echo "ha_matrix=$(python3 scripts/support_policy.py matrix)" >> "$GITHUB_OUTPUT"

  pytest-coverage:
    needs: changes
    if: needs.changes.outputs.pytest == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run tests with coverage in Home Assistant Docker
        id: pytest
        continue-on-error: true
        run: |
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/home-assistant/home-assistant:stable \
            sh -c '
              sh scripts/install-test-dependencies.sh || exit "$?"
              test_status=0
              python3 -m coverage run --branch -m pytest -q \
                --durations=15 --junitxml=junit.xml \
                -o junit_family=legacy || test_status=$?
              report_status=0
              python3 -m coverage json --fail-under=0 -o coverage.json || report_status=$?
              python3 -m coverage xml --fail-under=0 -o coverage.xml || report_status=$?
              python3 -m coverage report -m --fail-under=0 || report_status=$?
              python3 scripts/check_coverage.py coverage.json || report_status=$?
              if [ "$test_status" -ne 0 ]; then
                exit "$test_status"
              fi
              exit "$report_status"
            '
      - name: Check report file budgets
        id: report_budget
        if: ${{ always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        shell: bash
        run: |
          python3 - <<'PY'
          import stat
          from pathlib import Path
          reports = [Path('coverage.xml'), Path('junit.xml')]
          optional = Path('coverage.json')
          if optional.exists() or optional.is_symlink():
              reports.append(optional)
          total = 0
          for path in reports:
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                  raise SystemExit('Report must be a regular file with one link')
              if not 0 < info.st_size <= 16777216:
                  raise SystemExit('Report file budget exceeded')
              total += info.st_size
          if total > 33554432:
              raise SystemExit('Report aggregate budget exceeded')
          PY
      - name: Preserve attempt-specific test and coverage evidence
        if: ${{ always() && steps.report_budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-evidence-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            coverage.xml
            junit.xml
            coverage.json
      - name: Fail if tests failed
        if: ${{ steps.pytest.outcome == 'failure' }}
        run: exit 1

  quality-scale:
    needs: changes
    if: >-
      needs.changes.outputs.quality_scale == 'true' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.dedicated_quality_scale != 'true')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate quality scale evidence in Home Assistant Docker
        run: >
          docker run --rm
          -v "$PWD:/work"
          -w /work
          ghcr.io/home-assistant/home-assistant:stable
          python3 scripts/validate_quality_scale.py
      - name: Test quality scale and manifest contracts in Home Assistant Docker
        run: >
          docker run --rm
          -v "$PWD:/work"
          -w /work
          ghcr.io/home-assistant/home-assistant:stable
          sh -c 'sh scripts/install-test-dependencies.sh && python3 -m pytest -q
          tests/scripts/test_validate_quality_scale.py
          tests/test_manifest.py'

  validation-extras:
    needs: changes
    if: needs.changes.outputs.validation_extras == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run lint, fixture, and Home Assistant config validation
        env:
          HEP_SKIP_HA_SMOKE: "1"
          HEP_SKIP_PYTEST: "1"
          HEP_SKIP_QUALITY_SCALE: "1"
        run: scripts/docker-validate.sh

  runtime-compatibility:
    needs: changes
    if: needs.changes.outputs.pytest == 'true' || needs.changes.outputs.validation_extras == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.ha_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refresh runtime image
        run: docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - name: Test Home Assistant runtime contracts
        env:
          HA_VERSION: ${{ matrix.version }}
        run: scripts/docker-compatibility.sh "$HA_VERSION"
      - name: Exercise real platforms, services and storage
        env:
          HEP_HA_IMAGE: ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          HEP_VALIDATION_ARTIFACTS_DIR: ${{ runner.temp }}/ha-energy-planner-smoke
        run: scripts/docker-package-smoke.sh
      - name: Preserve smoke console and warning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ha-smoke-${{ matrix.version }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ha-energy-planner-smoke/docker-console.log
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.json
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.txt

  release-package:
    needs: changes
    if: needs.changes.outputs.pytest == 'true' || needs.changes.outputs.validation_extras == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build deterministic release artifact
        run: python3 scripts/package-release.py
      - name: Record release validation environment
        run: |
          docker pull "$(python3 scripts/support_policy.py image)"
          scripts/validation-environment.sh > validation-environment.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
            validation-environment.txt

  repository-checks:
    name: Repository checks
    if: ${{ always() }}
    needs: [changes, pytest-coverage, quality-scale, validation-extras, runtime-compatibility, release-package]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require every applicable check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in {'success', 'skipped'}]
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          print('All applicable repository checks passed.')
          PYTHON
