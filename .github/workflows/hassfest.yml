name: Validate with hassfest

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom_components/ha_energy_planner/**"
      - "quality_scale.yaml"
      - "README.md"
      - ".github/workflows/hassfest.yml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "custom_components/ha_energy_planner/**"
      - "quality_scale.yaml"
      - "README.md"
      - ".github/workflows/hassfest.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker://ghcr.io/home-assistant/hassfest:latest
