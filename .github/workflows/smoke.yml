name: Home Assistant Smoke

permissions:
  contents: read

on:
  schedule:
    - cron: "37 15 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-assistant-smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Run Home Assistant smoke test
        env:
          HEP_VALIDATION_ARTIFACTS_DIR: ${{ runner.temp }}/ha-energy-planner-smoke
        run: scripts/docker-ha-smoke.sh
      - name: Preserve smoke console and warning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ha-smoke-standalone
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ha-energy-planner-smoke/docker-console.log
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.json
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.txt
