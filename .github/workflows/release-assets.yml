name: Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-component:
    runs-on: ubuntu-26.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Build validated component and checksum
        run: python3 scripts/package-release.py --version "$RELEASE_TAG"
      - name: Verify packaged runtime before attaching assets
        env:
          HEP_VALIDATION_ARTIFACTS_DIR: ${{ runner.temp }}/ha-energy-planner-smoke
        run: scripts/docker-package-smoke.sh
      - name: Preserve smoke console and warning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ha-smoke-release
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ha-energy-planner-smoke/docker-console.log
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.json
            ${{ runner.temp }}/ha-energy-planner-smoke/warnings.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.zip
            dist/*.sha256
