[project]
name = "ha-energy-planner"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.energy-planner.support]
baseline = "2026.9.0"
previous = ["2026.8.2"]
mypy = "1.19.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/ha_energy_planner"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
strict = true
python_version = "3.14"
incremental = false
files = ["custom_components/ha_energy_planner"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
