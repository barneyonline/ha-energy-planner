[project]
name = "ha-energy-planner"
version = "1.4.9"
requires-python = ">=3.14"
dependencies = []

[tool.energy-planner.support]
baseline = "2026.10.0"
previous = []
mypy = "1.19.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Home Assistant 2026.10's HTTP implementation emits these aiohttp warnings.
# Keep only these upstream exceptions; new warnings still fail validation.
# See docs/validation-warnings.md for ownership and removal criteria.
filterwarnings = [
    "error",
    'ignore:^Inheritance class HomeAssistantApplication from web\.Application is discouraged$:DeprecationWarning:homeassistant\.components\.http\.server',
    'ignore:^It is recommended to use web\.AppKey instances for keys\.:aiohttp.web_exceptions.NotAppKeyWarning:homeassistant\.components\.http\.server',
]

[tool.coverage.run]
source = ["custom_components/ha_energy_planner"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
strict = true
python_version = "3.14"
incremental = false
files = ["custom_components/ha_energy_planner"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
