olicy such as Keep charger on is central configuration, while the compact Armed, Current state, Next actions, and Plan calendar status surface remains primary. Decision summary, Plan health, Current load forecast, Planning duration, and Load forecast coverage score are categorized as diagnostics. Current state, Next actions, and the Plan calendar follow the device selectors and omit disabled control areas.
