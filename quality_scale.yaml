    status: done
    comment: Automated execution remains fail-closed and auditable; operator disarm revokes authority and restores owned HVAC before flushing state, with real Store failures retaining retryable state and reporting the persistence error after restoration. Device control selectors persist disable before a best-effort restore and report incomplete recovery without re-enabling control, mapped EV charging feedback must confirm bounded start/stop and plug-in auto-start compensation attempts, and explicit action services and buttons raise translated Home Assistant errors for missing or ambiguous runtime state and rejected device commands.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/button.py
        - custom_components/ha_energy_planner/executor.py
        - custom_components/ha_energy_planner/ev_adapter.py
        - custom_components/ha_energy_planner/hvac_adapter.py
        - custom_components/ha_energy_planner/enphase_adapter.py
