# Climate recovery and allowance lifecycle: action_limits.py maintains rolling
# accounting independently of audit rotation; test_action_limits.py and
# test_control_runtime.py verify expiry, persistence, policy saves and resume.
# Resume climate planning service/button and actionable cap diagnostics are
# documented in the wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md.

# Confirmed calendar starts: tests/test_calendar.py and tests/test_executor.py.
# Persistent calendar history: calendar_history.py and storage.py retain only
# confirmed activity without expiry; calendar.py/coordinator.py capture live feedback
# and committed execution. tests/test_calendar_history.py, test_calendar.py,
# test_coordinator.py and test_storage.py cover skipped/failed/unconfirmed plans,
# queued start/stop events, superseded discrete confirmations, generation changes,
# vehicle-swap safety, feedback during initial and replacement plan publication,
# delayed phase acquisition and exact-deadline starts, later-action delays,
# elapsed feedback recovery and stale snapshots preserving newer phase estimates,
# delayed EV feedback, per-action capture and old-state proof during persistence,
# replans, reload and consistent current/range calendar state.
# Operator semantics and storage growth are documented in the wiki (indexed in docs/stable-release.md) and
# docs/requirements-audit.md; scripts/docker-validate.sh runs these regressions.
# Uncertain EV delivery cost and positive-power stall classification:
# tests/test_ev_optimization.py; operator behavior documented in the wiki EV guides (docs/stable-release.md index).

# Review regressions: full safety-stop evidence, prepare/complete phase timing,
# deferred Resume outcomes, refresh failure reporting and real HA debounce cooldown, off-state/legacy calendar handling and expired caps
# are covered in test_executor/coordinator/calendar/diagnostics.py.

# One stateful EV charger control: entry_data.py removes separate start/stop
# mappings, and __init__.py cleans saved recovery topology while preserving
# command identity and snapshots. test_config_flow.py and test_lifecycle.py
# cover configuration and upgrade behavior; test_ev_adapter.py, test_executor.py,
# test_action_limits.py and test_storage.py cover safe recovery and accounting.
# Review regressions preserve explicit dispatch evidence in audit and rolling
# allowance storage after partial power-limit commands or confirmation retries
# lose the charger target; test_executor.py and test_storage.py cover reloads.

# Climate reliability evidence: hvac_adapter.py and coordinator.py retain dependent
# restoration/command readback; storage.py isolates 100 records for 30 days.
# climate_inputs.py, climate_learning.py and climate_runtime.py preserve strict
# measured validation and explain rejected chronological windows. Regressions:
# tests/test_hvac_adapter.py, tests/test_climate_engine.py,
# tests/test_preconditioning.py, tests/test_storage.py and the sanitized
# tests/fixtures/climate/preconditioning_sep_oct_2026.json incident sequence.
# Review regressions additionally cover mixed pending control recovery without
# main power cycling, provenance declaration history preservation, qualified
# cadence migration and compatible redacted outcome readbacks after audit rotation.
# Additional review evidence: required-only coupled bounds clamps, guard-independent
# interrupted shutdown, rollback progress retained only for matching unsuperseded
# baselines, and declared tariff cadence identity when forecast gaps fill are
# covered by test_hvac_adapter.py, test_executor.py and test_preconditioning.py.
# Manual supersession retires settling expectations in listeners, executor markers
# and explicit override requests; completed dependent target recovery avoids main
# activation while pending main changes retain zone evidence. Regressions are in
# test_coordinator.py, test_executor.py and test_hvac_adapter.py.

# Export conflict recovery and stalled planning: enphase_export_limit.py retires
# superseded baselines and migrates saved conflict pauses after settled readback.
# EV auto-start feedback: coordinator.py preserves delayed/recovered feedback only
# for current charging intent on the same owned enabled actuator, retaining pause,
# capacity, expiry and stop checks. Activation preserves just-issued owned starts;
# executor.py suppresses interruption alerts for stops without dispatch and shares
# persisted ten-minute failure backoff across scheduled stops and auto-start
# compensation, retaining immediate manual stops and closing backoff only on
# confirmed safe-stop evidence. Vehicle policy release preserves stop backoff;
# reload, repeated-check, and vehicle selection regressions cover these paths.
# Evidence: tests/test_coordinator.py, tests/test_executor.py, tests/test_vehicles.py.
# coordinator.py avoids planner/command lock inversion and refresh under command
# ownership. Boundary callbacks publish clock-dependent status while refresh waits.
# task_lifecycle.py drains export reconciliation before unload restoration;
# external feedback adoption preserves failure pauses until explicit resume.
# Evidence: tests/test_export_limit.py, tests/test_coordinator.py,
# tests/test_sensor.py and tests/test_diagnostics.py; operator behavior is documented
# in the wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md. Full scripts/docker-validate.sh gate.
# Docker runners bootstrap pinned development tools from tests/requirements.txt;
# scripts/install-test-dependencies.sh supports production images without pytest.
# tests/scripts/test_select_ci_checks.py keeps all dependent CI gates selected.

# Zone temperature and adaptive timing evidence: zone_temperature.py, thermal_learning.py;
# tests/test_zone_temperature.py (sensor clocks, per-room coast, independent electrical readiness);
# tests/test_climate_engine.py (candidate-specific lead bounds); docs/climate-decisions.md.
# Base lead configuration: const.py/config_flow.py share a 360-minute limit for base and maximum;
# test_config_flow.py covers 240/240, 360/360, serialized save/reopen, defaults, zero and invalid values.
# test_control_runtime.py verifies real Core options persistence through restart at 240/240 and 360/360.
# test_planner.py verifies a genuine noon-to-16:00 unready-rate fallback; test_zone_temperature.py
# preserves directional readiness and disabled-learning behavior. Defaults remain 90/180 minutes;
# tariff, comfort, ownership, restoration and measured-energy gates remain in the full Docker gate.
# Shared electrical evidence: test_third_review_* in tests/test_zone_temperature.py.
# Independent zone completion: zone_control.py requires explicit registry-matched pairs and installer-verified safe open sets; hvac_adapter.py confirms opens before closures and retains original baselines via hvac_control.py. tests/test_zone_control.py covers directional room completion, dwell, freshness, airflow rejection, feedback, restoration and model isolation. See docs/climate-decisions.md and docs/requirements-audit.md; full validation remains scripts/docker-validate.sh.
# Zone review regressions: tests/test_zone_control.py verifies durable paired manual supersession, hidden-target retries with retained power, no-op head restoration, Observe release preservation, hold-only economic isolation and confirmed pause timestamps across queued refreshes.
# Further zone review: tests/test_zone_control.py covers unavailable damper feedback during persistence, stopped-head recovery with manual exclusions, and main/sibling/exact-zone override scopes during durable switch dispatch and delayed readback.
# Deferred zone recovery: tests/test_zone_control.py preserves paired power through off-head deferral and partial progress, restores hidden targets after normal operation resumes, and never acquires an actuator with no saved baseline.
# Manual head supersession: deferred pair recovery under an already-active head preserves its current mode/target and emits only explicitly owned zone commands (tests/test_zone_control.py).
# Bounded pair exposure: tests/test_zone_control.py verifies that invalid/incompatible targets and already-restored targets do not reopen closed actuators, including mixed eligible/blocked pairs and later compatible readback.
# Subset fallback eligibility: tests/test_zone_control.py rejects new away-preconditioning candidates after economic activation in Automatic/Observe while preserving initial fallback, existing tariff cycles and explicit Legacy policy.

# Equipment compensation and retained thermal evidence: config_flow.py/climate_inputs.py
# validate paired bounded offsets; zone_control.py separates room/equipment goals and
# compatible shared-head targets; constraints.py verifies room authority; hvac_adapter.py
# rechecks live mode/bounds/step before confirmed sequential writes and after persistence.
# thermal_learning.py retains bounded source evidence across transitions/reload while
# selecting matching physical regimes. tests/test_hvac_equipment_learning.py proves
# Main 19 equipment vs 21 room, unchanged Bedrooms/heating, pause/restart, hidden targets,
# restore/manual boundaries and real PlannerStore save/load, regime reuse and invalidation.
# Existing threshold/expiry and full scripts/docker-validate.sh gates remain unchanged.

# Review evidence: tests/test_hvac_equipment_learning.py exercises offset read/save
# from either paired alias and room-goal/equipment-target separation in calendar.py
# and plan_presentation.py, with no changes to commands or comfort bounds.

# Mode-specific compensation limits: tests/test_hvac_equipment_learning.py verifies
# heat/off-to-cool transitions validate the exact target after mode confirmation,
# reject invalid cooling bounds before the target write and preserve restoration.
