rules:
  action-setup:
    status: done
    comment: Integration services are registered from async_setup and are covered by service tests and Docker smoke automation.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/services.yaml
        - custom_components/ha_energy_planner/preflight.py
      tests:
        - tests/test_services.py
        - scripts/docker-ha-smoke.sh
  appropriate-polling:
    status: done
    comment: EV search reuses validated battery forecast inputs across candidates with independent storage simulation and an unchanged five-second performance gate. The coordinator schedules wall-clock interval refreshes and explicit decision-input replans, observes mapped EV charging feedback for immediate plug-in auto-start compensation, coalesces storms behind a safe minimum interval, skips unchanged input fingerprints instead of fixed blind polling, fetches and caches official hourly weather responses within both refresh and freshness limits with forced manual refresh and shared unavailable-entity checks before weather and device service calls while allowing forecasts with unknown current conditions, persists continuous household-load outage timing across reloads, defaults to six-hour quality-approved fallback for unavailable or stale source samples with conservative scheduled EV starts and a one-time legacy setting migration, allows bounded Daikin mode-specific target recall with a 30-second initial confirmation wait and read-only reconciliation until 180 seconds after issue, persists uncertain commands, activation proof and original restoration settings across reloads, reconciles the latest pending intent through failed ownership transitions without resurrecting retired commands, avoids uncertain duplicate writes, confirms zone targets sequentially, rechecks manual supersession after intent persistence, respects entity-specific restoration overrides, and settles accepted mode changes before manual rollback, starts the 30-minute startup grace at Core RUNNING, preserves a restart-resumable disarmed recovery handoff when setup encounters a temporary all-control pause or changed production-evidence contract, awaits non-debounced validation refreshes, and retries every 30 seconds until a fresh healthy plan passes recovery safety checks and permits re-arming.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/hvac_adapter.py
        - custom_components/ha_energy_planner/hvac_control.py
        - custom_components/ha_energy_planner/executor.py
      tests:
        - tests/test_coordinator.py
        - tests/test_hvac_adapter.py
        - tests/test_executor.py
  brands:
    status: done
    comment: Custom repository validation tracks the manifest and integration metadata; no upstream brand asset is required for this local custom integration.
    references:
      code:
        - custom_components/ha_energy_planner/manifest.json
      docs:
        - README.md
  common-modules:
    status: done
    references:
