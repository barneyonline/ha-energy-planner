# EV daylight cost evidence: planner_ev.py reports delivered seed energy at effective prices without discarding daylight eligibility; ev_optimization.py validates physical readiness before ranking economic cost ahead of daylight. tests/test_ev_daylight_cost.py and tests/test_ev_optimization.py cover peak evening versus cheaper morning, overnight capacity/buffer failures before earliest-start, retained schedules, partial delivery, solar export value, honest revalidation evidence, equal-cost ties and necessary expensive readiness. Learned-rate/overnight-capacity presentation regressions prevent unsupported cost-neutrality claims in action explanations and daylight status. README.md, docs/ev-scheduling.md and docs/requirements-audit.md document the corrected preference. Full validation remains scripts/docker-validate.sh.
# EV refusal timestamp evidence: tests/test_ev_telemetry.py and tests/test_executor.py cover older cached charging feedback and invalid source timestamps through telemetry and manual confirmation; fresh positive evidence still resets the wait. Full validation remains scripts/docker-validate.sh.
# EV refusal safety review: tests/test_executor.py and tests/test_vehicles.py cover telemetry persistence failures before stops, tracked unplug release without a disconnected sample, and newer refusal during/after queued ownership reconciliation. The unchanged full Docker gate remains required.
# EV refusal review evidence: tests/test_ev_telemetry.py, tests/test_ev_adapter.py and tests/test_executor.py reproduce rejected/unconfirmed manual-reset leaks, rewritten refusal provenance, repeated status/unplug races, stopped Finishing feedback and refusal lost through failed power-limit compensation. The unchanged full gate enforces statement and reviewed branch coverage.
# EV vehicle refusal evidence: ev.py, ev_telemetry.py, ev_adapter.py, planner.py and executor.py; refusal regressions in tests/test_ev_adapter.py, tests/test_ev_optimization.py, tests/test_ev_telemetry.py, tests/test_planner.py, tests/test_executor.py, tests/test_ev_resilience.py, tests/test_services.py and tests/test_storage.py cover normalization, pre-write guards, bounded compensation, persistent waits, explicit reset, uncertain reservations and honest action accounting. README.md, docs/ev-scheduling.md and docs/requirements-audit.md describe physical acceptance limits; scripts/docker-validate.sh remains required.
# Forecast publication evidence: tests/test_forecast_publication.py covers committed-plan snapshot retention through real Store bucket replacement, immediate/coalesced disk yields, interval and execution listeners, HA publication/failure handling, EV connected/disconnected contexts, generation cancellation and strict missing/invalid/other-plan evidence rejection. Replay retention, control authority and freshness gates remain unchanged. Full validation remains scripts/docker-validate.sh.
# Exact coverage evidence: tests/test_forecasts.py::test_forecast_coverage_thresholds_use_exact_elapsed_duration covers eight/twelve-hour thresholds, one-second shortfalls, and one-second split tariff boundaries; forecasts.py sums timedeltas before converting to hours. Full validation remains scripts/docker-validate.sh.
# Further interval/history evidence: tests/test_inputs.py and tests/test_forecasts.py cover duration-weighted tariff, PV, weather and partial-point confidence plus exact load coverage; tests/test_calendar_history.py verifies label upgrades preserve confirmed phase identity and separate UIDs. Full validation remains scripts/docker-validate.sh.
# Split-interval review evidence: tests/test_planner.py validates daylight adjacency; tests/test_ev_optimization.py checks actual pre-window capacity; tests/test_inputs.py and tests/test_forecast_calibration.py cover elapsed calibration leads and horizon-spanning snapshots; tests/test_climate_engine.py verifies observation baseline ends and invalid-evidence rejection. Full validation remains scripts/docker-validate.sh.
# Stable tariff/phase evidence: planning_grid.py retains native UTC boundaries with partial first/tail intervals; inputs, forecasts, load_forecast and energy simulators carry actual durations. tests/test_inputs.py and tests/test_planner.py cover stable 16:00 peaks, lifecycle identity, exact horizon and integrated energy. coordinator.py and __init__.py isolate HVAC policy/room-feedback edits from unrelated ownership; tests/test_coordinator.py verifies pending export confirmation survives. calendar.py/calendar_history.py render phase durations and confirmed evidence; preconditioning.py and thermal_learning.py explain unknown fallback finishing temperatures. README.md, docs/climate-decisions.md and docs/requirements-audit.md document behavior and physical-evidence limits; scripts/docker-validate.sh remains the full gate.
# Scheduler classifier guard evidence: hvac_adapter.py verifies finite shared timer and flag coverage before each write through its original reconciliation deadline plus classifier settling; tests/test_hvac_adapter.py models external 3/5-second triggers and 3-second settling, delayed head/zone feedback, explicit users, sequential writes, shared ownership, idle-automation no-op refreshes, timeouts, recovery helper failure without premature compensation, retirement of cancelled unsent intents and original-deadline reload recovery including helper latency and expired matching snapshots. The wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md document bounded expiry and live acceptance limits.
# Confirmed zone clamp evidence: executor.py anchors bounded coupled-zone settling to first head-temperature confirmation; coordinator.py verifies exact bounds clamps against current readback, with 30 seconds of polling margin, captured-target recovery and transaction-local confirmed activation proof for either split update order and related parent contexts. tests/fixtures/hvac/delayed_zone_clamp.json, tests/test_coordinator.py and tests/test_control_runtime.py cover the observed 121.4-second delay, immutable confirmation/absolute deadlines, no-op refreshes, manual attribution/conflicts, issue-ordered activation retirement across transactions and zone aliases, failed/unconfirmed reactivation, bounded history and real HA ownership preservation. See docs/climate-decisions.md and docs/requirements-audit.md.
# Delayed feedback and EV deadline evidence: executor.py retains bounded HVAC expectations after readback timeouts; ev_adapter.py enforces charging leases; ev_telemetry.py uses authoritative source timestamps; tests/test_coordinator.py, tests/test_ev_adapter.py, tests/test_ev_telemetry.py, tests/test_executor.py and tests/test_control_runtime.py cover delayed commands, manual conflicts, cached readings, expired starts, uncertain recovery, transient persistence failures and observed-power grid reservations through rejected starts, confirmed reductions, newer power during post-confirmation bookkeeping and nested queued state events with confirmation sample ordering. See docs/requirements-audit.md.
# Profile recovery isolation: executor.py skips unowned profile fallback when Profile control is off; tests/test_executor.py and tests/test_export_limit.py cover reload/unload restoration and retained owned baselines, and tests/test_coordinator.py verifies startup re-arming with an unavailable unowned profile.
# Export Limit Select mapping evidence: enphase_export_limit.py resolves matching sensor readback by registry identity; coordinator.py observes sensor attributes and follows registry additions, removals and renames; tests/test_export_limit.py covers Select dispatch, missing/cross-site/stale feedback, export-only activation, profile isolation and cross-planner sensor/Select alias rejection; scripts/docker-ha-smoke.sh covers registry-backed Select control.
# Export Limit evidence: export_limit_policy.py, enphase_export_limit.py; tests/test_export_limit.py; tests/fixtures/live_schema/enphase_export_limit_*.json and export_tariff_half_hour.json; tests/fixtures/replay/export_limit_*.json; scripts/docker-ha-smoke.sh; the wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md.
# Amber interval compatibility: export_limit_policy.py recognizes only declared 30-minute, aligned first-second starts; tests/test_export_limit.py covers boundary signs, key styles, native forecast precedence, DST, mixed exact/native blocks, malformed evidence, real gaps/overlaps and confirmed command deduplication; tests/fixtures/live_schema/export_tariff_amber_first_second.json is exercised by scripts/docker-validate.sh. See README.md and docs/requirements-audit.md.
# Export Limit recovery evidence: tests/test_export_limit.py and tests/test_lifecycle.py cover retained Unconfirmed requests, independent startup/toggle gates, persistence rollback, external slew changes, pending unload and off-selector restoration visibility.
# Export Limit isolation and confidence evidence: tests/test_export_limit.py covers selective resume with absent/inactive/expired and legacy pauses, all supported confidence aliases/encodings, invalid confidence and dispatch-time threshold revalidation.
# HA startup manual override evidence: coordinator.py; startup HVAC regressions in tests/test_coordinator.py; docs/requirements-audit.md.
# Staged load recovery: ev_resilience.py, startup_recovery.py; recovery/input/coordinator/config-flow tests.
# Recovery handoff retries and renewed-outage invalidation: tests/test_coordinator.py.
# Charge now freshness and interruption recurrence: tests/test_control_runtime.py and tests/test_executor.py.
# EV outage resilience: ev_resilience.py; tests/test_ev_resilience.py; docs/ev-scheduling.md.
# Configurable defaults: EV 10 actions, climate 12 actions, manual HVAC override 60 minutes; existing saved values are preserved.
# Shutdown feedback evidence: tests/test_hvac_adapter.py covers scoped main-off zone feedback, manual-change exclusions and failed-command cleanup.
# Notification recovery evidence: notifications.py, executor.py, coordinator.py, startup_recovery.py and storage.py; tests/test_notification_recovery.py, tests/test_notifications.py, tests/test_storage.py and tests/test_storage_runtime.py cover per-device confirmation, pending/guarded restores, reloads, failed notification cleanup retries, concurrent refresh/device outcomes, startup report supersession and resolved entry cleanup.
# EV action-cap evidence: tests/test_ev_optimization.py and tests/test_executor.py cover cap-specific diagnosis, configurable allowance recovery, physical shortfalls, and notifications; see docs/requirements-audit.md.
# Deferred-zone startup evidence: tests/test_hvac_adapter.py covers fresh-context target recovery during main/switch turn-on, including remembered heating during a cooling startup and the subsequent command-scoped heat-to-cool zone transition, and rejection of attributed, out-of-phase, unrelated, invalid, and auxiliary-setting feedback; see docs/requirements-audit.md.
# Climate lifecycle evidence: tests/test_inputs.py covers persisted-grid tariff revalidation; tests/test_executor.py and tests/test_hvac_adapter.py cover baseline retention, dependent target restoration and interrupted off cleanup; tests/test_diagnostics.py, tests/test_sensor.py and tests/test_planner.py distinguish learning from execution with readable bounded evidence. See docs/requirements-audit.md.
# Settings ownership evidence: tests/test_vehicles.py verifies hub/profile field separation, hidden-value preservation, optional power inheritance, advanced calibration and shared charger power limits.
# Shared-charger vehicle evidence: vehicles.py, select.py, tests/test_vehicles.py (guest load accounting, unplug reservation release, runtime deadlines, charger-first setup, SOC normalization, pre-plan override reset, queued calibration interruptions, restart evidence, outage unplug boundaries, unplug during pending ownership writes); see docs/requirements-audit.md.
# Export Limit calendar evidence: calendar.py groups contiguous equal-setting intervals and retains per-interval prices/local times; calendar_history.py labels new and saved confirmed actions without changing their identity or timestamps. tests/test_export_limit.py and tests/test_calendar_history.py cover grouping boundaries, tariff evidence and idempotent confirmed history; the wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md document planned versus confirmed entries.
# Export restoration history: enphase_export_limit.py gives manual restorations a durable request-based outcome identity; calendar_history.py records only confirmed state-changing restoration readback with its actual setting and explicit Restored label. tests/test_export_limit.py covers baseline retention, Disabled/0 W/nonzero cycles, delayed feedback, pending reload, repeated reconciliation, separate requests and failed/no-op exclusion; tests/test_calendar_history.py covers malformed/unsupported evidence and slew restoration; tests/test_storage.py verifies persisted history reload and duplicate confirmation. See the wiki (indexed in docs/stable-release.md) and docs/requirements-audit.md for confirmation timing and configuration-recovery follow-up.
