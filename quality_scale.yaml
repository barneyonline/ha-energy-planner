    status: done
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
      tests:
        - tests/test_lifecycle.py
  docs-configuration-parameters:
    status: done
    comment: EV readiness, capacity, optional power controls, measured learning, and emergency spending are documented in docs/ev-scheduling.md. Central settings document the 0–1440 minute conservative household-load fallback with a six-hour default, climate away-preconditioning opt-in, catch-up windows, default-off configured-zone synchronisation, discovery and execution-time rollback-target gates, main-first target ordering, disabled-sync target isolation, acquisition rollback and retry of the complete main state including Daikin's remembered active mode, independent off cleanup and blocking of reacquisition while main recovery remains unresolved, exact pending main/zone targets and explicitly phased main turn-on and context-correlated coupled zone-actuator feedback classification, synchronous in-flight abort across acquisition rollback and recovery, crash-safe preservation of superseding manual main changes, and per-zone supersession that removes only the user's zone before remaining rollback actuators run, zone switch/helper restoration and zone-climate target propagation, ownership-aware release and command-cap behavior, source/asset-specific confidence and pause isolation, directional comfort/minimum-cycle safeguards with corrective preconditioning continuation and target-driven early coasting, directional coast comfort handoffs even for stale persisted phases, stable tariff lifecycle identity, measured-power provenance and qualified-only observation cadence, and bounded manual-override helper behavior. Detailed operator guidance now lives in the wiki, indexed in docs/stable-release.md.
    references:
      docs:
        - docs/stable-release.md
        - docs/release-checklist.md
        - ha-energy-planner-spec.md
  docs-installation-parameters:
    status: done
    comment: README quick install links to the full wiki Installation guide; docs/stable-release.md supplies setup examples and its documentation map.
    references:
      docs:
        - docs/stable-release.md
  entity-unavailable:
    status: done
    comment: Live Plan health exposes pending durable HVAC restoration as degraded, including unresolved targets and automations; input health remains separately visible. Zone restores defer incompatible targets without repeated invalid commands, preserve the original baseline, and accept already-confirmed targets despite changed command bounds. Health reporting tolerates legacy non-mapping HVAC ownership. Decision diagnostics expose degraded or unsafe inputs and execution fails closed. CoordinatorEntity marks entities unavailable on refresh failure. AI Task discovery allows first-use unknown while rejecting missing and explicitly unavailable providers.
    references:
      code:
        - custom_components/ha_energy_planner/binary_sensor.py
        - custom_components/ha_energy_planner/inputs.py
        - custom_components/ha_energy_planner/discovery.py
      tests:
        - tests/test_sensor.py
        - tests/test_inputs.py
        - tests/test_discovery.py
        - tests/fixtures/replay/stale_input_suppresses_control.json
  integration-owner:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/manifest.json
  log-when-unavailable:
    status: done
    comment: A bounded 30-minute Core startup grace suppresses initial input warnings without weakening safety; persistent outages warn after expiry and new or repeated outages warn immediately even while another input is starting. Planner-owned unavailable and recovery transitions are logged once per affected input with allowlisted issue codes, bounded configured entity IDs, and recovery duration. Stable input identities retain outage timing across reason changes and partial issue resolution; recovery is logged only after all input issues clear. Upstream integrations retain responsibility for their raw provider outages; repeated refreshes do not duplicate planner warnings.
    references:
      code:
        - custom_components/ha_energy_planner/availability.py
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/executor.py
      tests:
        - tests/test_availability.py
        - tests/test_coordinator.py
        - tests/test_executor.py
        - scripts/docker-ha-smoke.sh
  parallel-updates:
    status: done
    comment: All live platforms declare PARALLEL_UPDATES=0. Coordinator command and device locks serialize outbound transactions across platforms and domain services while keeping disarm dispatchable. Listener jobs are entry-owned and drained safely on unload; queued jobs reject teardown after acquiring their lock.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/executor.py
        - custom_components/ha_energy_planner/task_lifecycle.py
      tests:
        - tests/test_coordinator.py
        - tests/test_executor.py
        - tests/scripts/test_validate_quality_scale.py
