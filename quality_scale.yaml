levels:
  bronze:
    required:
      - action-setup
      - appropriate-polling
      - brands
      - common-modules
      - config-flow-test-coverage
      - config-flow
      - dependency-transparency
      - docs-actions
      - docs-conditions
      - docs-high-level-description
      - docs-installation-instructions
      - docs-removal-instructions
      - docs-triggers
      - entity-event-setup
      - entity-unique-id
      - has-entity-name
      - runtime-data
      - test-before-configure
      - test-before-setup
      - unique-config-entry
  silver:
    required:
      - action-exceptions
      - config-entry-unloading
      - docs-configuration-parameters
      - docs-installation-parameters
      - entity-unavailable
      - integration-owner
      - log-when-unavailable
      - parallel-updates
      - reauthentication-flow
      - test-coverage
  gold:
    required:
      - devices
      - diagnostics
      - discovery-update-info
      - discovery
      - docs-data-update
      - docs-examples
      - docs-known-limitations
      - docs-supported-devices
      - docs-supported-functions
      - docs-troubleshooting
      - docs-use-cases
      - dynamic-devices
      - entity-category
      - entity-device-class
      - entity-disabled-by-default
      - entity-translations
      - exception-translations
      - icon-translations
      - reconfiguration-flow
      - repair-issues
      - stale-devices
  platinum:
    required:
      - async-dependency
      - inject-websession
      - strict-typing

rules:
  action-setup:
    status: done
    comment: Integration services are registered from async_setup and are covered by service tests and Docker smoke automation.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/services.yaml
        - custom_components/ha_energy_planner/preflight.py
      tests:
        - tests/test_services.py
        - scripts/docker-ha-smoke.sh
  appropriate-polling:
    status: done
    comment: The coordinator schedules wall-clock interval refreshes and explicit decision-input replans, observes mapped EV charging feedback for immediate plug-in auto-start compensation, coalesces storms behind a safe minimum interval, skips unchanged input fingerprints instead of fixed blind polling, fetches and caches official hourly weather responses within both refresh and freshness limits with forced manual refresh, persists continuous household-load outage timing across reloads, starts the ten-minute startup grace at Core RUNNING, preserves a restart-resumable disarmed recovery handoff when setup encounters a temporary all-control pause or changed production-evidence contract, awaits non-debounced validation refreshes, and retries every 30 seconds until three consecutive healthy checks permit re-arming.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
      tests:
        - tests/test_coordinator.py
  brands:
    status: done
    comment: Custom repository validation tracks the manifest and integration metadata; no upstream brand asset is required for this local custom integration.
    references:
      code:
        - custom_components/ha_energy_planner/manifest.json
      docs:
        - README.md
  common-modules:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/planner.py
        - custom_components/ha_energy_planner/inputs.py
        - custom_components/ha_energy_planner/forecasts.py
        - custom_components/ha_energy_planner/storage.py
        - custom_components/ha_energy_planner/durable_storage.py
        - custom_components/ha_energy_planner/preflight.py
        - custom_components/ha_energy_planner/ev.py
        - custom_components/ha_energy_planner/ev_adapter.py
        - custom_components/ha_energy_planner/entity_registry_migration.py
        - custom_components/ha_energy_planner/adapter_helpers.py
        - custom_components/ha_energy_planner/command_models.py
        - custom_components/ha_energy_planner/enphase_control.py
        - custom_components/ha_energy_planner/ev_control.py
        - custom_components/ha_energy_planner/hvac_control.py
        - custom_components/ha_energy_planner/plan_presentation.py
        - custom_components/ha_energy_planner/training.py
        - custom_components/ha_energy_planner/weather.py
      tests:
        - tests/test_planner.py
        - tests/test_inputs.py
        - tests/test_forecasts.py
        - tests/test_storage.py
        - tests/test_services.py
        - tests/test_ev.py
        - tests/test_ev_adapter.py
        - tests/test_ev_control_entities.py
  config-flow-test-coverage:
    status: done
    comment: The central Configure flow covers all input mappings and policy constraints, including the required vehicle SOC, charging-feedback, and authoritative target-SOC mappings plus settings-only ready-by, opportunistic, and daylight lowest-cost EV controls; EV SOC-per-kWh copy documents automatic Recorder calibration and its conservative bootstrap value, and regression coverage verifies that Add device subentry flows are not exposed.
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
      tests:
        - tests/test_config_flow.py
  config-flow:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
        - custom_components/ha_energy_planner/manifest.json
      tests:
        - tests/test_config_flow.py
      docs:
        - README.md
  dependency-transparency:
    status: done
    comment: The manifest declares no Python package requirements; Home Assistant APIs and standard-library helpers are used directly.
    references:
      code:
        - custom_components/ha_energy_planner/manifest.json
  docs-actions:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/services.yaml
      docs:
        - README.md
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom automation conditions.
    references:
      docs:
        - README.md
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom automation triggers.
    references:
      docs:
        - README.md
  docs-high-level-description:
    status: done
    references:
      docs:
        - README.md
        - docs/stable-release.md
        - docs/release-checklist.md
        - ha-energy-planner-spec.md
  docs-installation-instructions:
    status: done
    references:
      docs:
        - README.md
  docs-removal-instructions:
    status: done
    references:
      docs:
        - README.md
  entity-event-setup:
    status: done
    comment: Entities are coordinator-backed and listeners are owned by the coordinator lifecycle.
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
        - custom_components/ha_energy_planner/coordinator.py
      tests:
        - tests/test_lifecycle.py
  entity-unique-id:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
      tests:
        - scripts/docker-ha-smoke.sh
  has-entity-name:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
      tests:
        - tests/test_sensor.py
  runtime-data:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/coordinator.py
      tests:
        - tests/test_lifecycle.py
  test-before-configure:
    status: done
    comment: Initial setup only creates a named local planner; Configure validates mapped entities and policy before command authority. This service integration has no remote connection to test at name creation.
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
      tests:
        - tests/test_config_flow.py
  test-before-setup:
    status: done
    comment: Config-entry setup loads Store, performs the first coordinator refresh, and restores safe state on setup failure.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
      tests:
        - tests/test_lifecycle.py
  unique-config-entry:
    status: done
    comment: Multiple EV planners are intentional; each entry requires a unique operator-selected instance name, active EV commands share an atomic household grid-capacity reservation and single-entry over-limit shedding claim, and EV charger plus household climate entities, automations, zones, writable override helpers, and Enphase actuators are single-owner across entries.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/config_flow.py
        - custom_components/ha_energy_planner/executor.py
        - custom_components/ha_energy_planner/storage.py
      tests:
        - tests/test_config_flow.py
        - tests/test_executor.py
        - tests/test_lifecycle.py
        - tests/test_storage.py
  action-exceptions:
    status: done
    comment: Automated execution remains fail-closed and auditable; operator disarm revokes authority and restores owned HVAC before flushing state, with real Store failures retaining retryable state and reporting the persistence error after restoration. Device control selectors persist disable before a best-effort restore and report incomplete recovery without re-enabling control, mapped EV charging feedback must confirm bounded start/stop and plug-in auto-start compensation attempts, and explicit action services and buttons raise translated Home Assistant errors for missing or ambiguous runtime state and rejected device commands.
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/button.py
        - custom_components/ha_energy_planner/executor.py
        - custom_components/ha_energy_planner/ev_adapter.py
        - custom_components/ha_energy_planner/hvac_adapter.py
        - custom_components/ha_energy_planner/enphase_adapter.py
        - custom_components/ha_energy_planner/strings.json
      tests:
        - tests/test_services.py
        - tests/test_switch_button.py
        - tests/test_executor.py
        - tests/test_control_runtime.py
        - tests/test_ev_adapter.py
        - tests/test_hvac_adapter.py
        - tests/test_enphase_adapter.py
  config-entry-unloading:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/__init__.py
      tests:
        - tests/test_lifecycle.py
  docs-configuration-parameters:
    status: done
    comment: Central settings document the 0–30 minute conservative household-load outage grace, climate away-preconditioning opt-in, catch-up windows, default-off configured-zone synchronisation, discovery and execution-time rollback-target gates, main-first target ordering, disabled-sync target isolation, acquisition rollback and retry of the complete main state including Daikin's remembered active mode, independent off cleanup and blocking of reacquisition while main recovery remains unresolved, exact pending main/zone targets and explicitly phased main turn-on and context-correlated coupled zone-actuator feedback classification, synchronous in-flight abort across acquisition rollback and recovery, crash-safe preservation of superseding manual main changes, and per-zone supersession that removes only the user's zone before remaining rollback actuators run, zone switch/helper restoration and zone-climate target propagation, ownership-aware release and command-cap behavior, source/asset-specific confidence and pause isolation, directional comfort/minimum-cycle safeguards, and bounded manual-override helper behavior.
    references:
      docs:
        - README.md
        - docs/stable-release.md
        - docs/release-checklist.md
        - ha-energy-planner-spec.md
  docs-installation-parameters:
    status: done
    references:
      docs:
        - README.md
  entity-unavailable:
    status: done
    comment: Live Plan health and decision diagnostics expose degraded or unsafe inputs and execution fails closed. CoordinatorEntity marks entities unavailable on refresh failure. AI Task discovery allows first-use unknown while rejecting missing and explicitly unavailable providers.
    references:
      code:
        - custom_components/ha_energy_planner/binary_sensor.py
        - custom_components/ha_energy_planner/inputs.py
        - custom_components/ha_energy_planner/discovery.py
      tests:
        - tests/test_sensor.py
        - tests/test_inputs.py
        - tests/test_discovery.py
        - tests/fixtures/replay/stale_input_suppresses_control.json
  integration-owner:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/manifest.json
  log-when-unavailable:
    status: done
    comment: Planner-owned unavailable and recovery transitions are logged once per transition with bounded reasons. Upstream integrations retain responsibility for their raw provider outages; repeated refreshes do not duplicate planner warnings.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/executor.py
      tests:
        - tests/test_executor.py
        - scripts/docker-ha-smoke.sh
  parallel-updates:
    status: done
    comment: All live platforms declare PARALLEL_UPDATES=0. Coordinator command and device locks serialize outbound transactions across platforms and domain services while keeping disarm dispatchable. Listener jobs are entry-owned and drained safely on unload; queued jobs reject teardown after acquiring their lock.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/executor.py
        - custom_components/ha_energy_planner/task_lifecycle.py
      tests:
        - tests/test_coordinator.py
        - tests/test_executor.py
        - tests/scripts/test_validate_quality_scale.py
  reauthentication-flow:
    status: exempt
    comment: This local-first integration stores entity/service mappings and no remote account credential that requires Home Assistant reauthentication.
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
        - custom_components/ha_energy_planner/manifest.json
  test-coverage:
    status: done
    comment: Dockerized pytest, explicit three-day EV and bounded-gap household-history boundaries, bounded/chunked EV Recorder import, coordinator execution-lock and newest-plan coalescing coverage, hourly weather response/cache/DST coverage, short household-load outage grace boundaries, climate rollback-target race rejection, refresh-storm thermal maturation, effective AI/pause diagnostics, bucketed forecast persistence, consolidated settings and EV option placement, startup source-appearance retry coverage, EV opportunistic-charging, complete daylight-window preference and ready-by fallback, earliest-start, and delayed command-feedback tests, external forecast coverage/stitching fixtures, deterministic Recorder-backed load-model cleaning/quality/DST/age/resampling, day-block conservative calibration, explicit combined-bypass isolation and score visibility, and contract-transition tests, conservative grid-bound and action-time evidence tests, replay fixtures, dependency-free core live-schema and Recorder-history profiles, rolling-origin persistence and conservative-coverage gates, Home Assistant check_config, and the completion-driven Energy Planner Docker smoke path are enforced by scripts/docker-validate.sh. Pull requests select affected expensive jobs with a fail-safe changed-path classifier; behavioral changes, pushes and manual runs include minimum-version, pinned-baseline and stable runtime and smoke checks. Statement coverage remains exactly 100 percent; branch evidence is published and per-module regressions are rejected. Runtime smoke installs a deterministic release package and upgrade tests preserve previous-release recovery evidence.
    references:
      tests:
        - tests/test_ha_runtime.py
        - tests/test_control_runtime.py
        - tests/fixtures/decision_replay/ev_reprice_override_recovery.json
        - tests/fixtures/decision_replay/ev_autumn_ready_by.json
        - tests/test_storage_runtime.py
        - tests/test_upgrade_runtime.py
        - tests/scripts/test_release_tools.py
        - tests/test_device_registry_runtime.py
        - tests/test_training.py
        - scripts/docker-compatibility.sh
        - scripts/check_coverage.py
        - tests/test_planner.py
        - tests/test_ev.py
        - tests/test_executor.py
        - tests/test_services.py
        - tests/test_real_history_fixtures.py
        - tests/test_forecast_accuracy.py
        - tests/test_forecasts.py
        - tests/test_inputs.py
        - tests/test_load_forecast.py
        - tests/test_recorder_import.py
      code:
        - custom_components/ha_energy_planner/load_forecast.py
        - custom_components/ha_energy_planner/recorder_import.py
        - scripts/docker-validate.sh
        - scripts/validate-real-history-fixture.py
  devices:
    status: done
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
      tests:
        - scripts/docker-ha-smoke.sh
  diagnostics:
    status: done
    comment: Redacted diagnostics include bounded model state, rolling refresh metrics, trigger/coalescing counters, phase timing, usable optimization horizon, detailed dry-run evidence, and current or pending AI advice. Persistent notifications are queued by stable ID until Home Assistant reaches its running state, with queued alerts cancelled on recovery, and the Explain control publishes bounded pending, accepted, rejected, and failure notifications. Every recorder-facing sensor and binary-sensor payload has a tested UTF-8 byte budget below Recorder's hard limit; calendar event metadata is explicitly byte-bounded, grouped into readable sections, and uses local time for embedded timestamps.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/diagnostics.py
        - custom_components/ha_energy_planner/entity.py
        - custom_components/ha_energy_planner/sensor.py
        - custom_components/ha_energy_planner/binary_sensor.py
        - custom_components/ha_energy_planner/calendar.py
      tests:
        - tests/test_diagnostics.py
        - tests/test_coordinator.py
        - tests/test_entity.py
        - tests/test_sensor.py
        - tests/test_binary_sensor.py
        - tests/test_calendar.py
        - scripts/docker-ha-smoke.sh
  discovery-update-info:
    status: exempt
    comment: The integration is configured explicitly and does not use Home Assistant discovery flows; its internal capability preflight is runtime validation, not device discovery.
    references:
      code:
        - custom_components/ha_energy_planner/discovery.py
        - custom_components/ha_energy_planner/coordinator.py
      tests:
        - tests/test_discovery.py
        - scripts/docker-ha-smoke.sh
  discovery:
    status: exempt
    comment: The integration does not discover devices or services; users explicitly map existing Home Assistant entities and services through the central Configure input sections.
    references:
      code:
        - custom_components/ha_energy_planner/discovery.py
      tests:
        - tests/test_discovery.py
  docs-data-update:
    status: done
    references:
      docs:
        - README.md
        - docs/requirements-audit.md
  docs-examples:
    status: done
    references:
      docs:
        - README.md
  docs-known-limitations:
    status: done
    references:
      docs:
        - README.md
        - docs/requirements-audit.md
  docs-supported-devices:
    status: done
    references:
      docs:
        - README.md
        - docs/stable-release.md
        - docs/release-checklist.md
        - ha-energy-planner-spec.md
  docs-supported-functions:
    status: done
    references:
      docs:
        - README.md
        - docs/stable-release.md
        - docs/release-checklist.md
        - ha-energy-planner-spec.md
  docs-troubleshooting:
    status: done
    references:
      docs:
        - README.md
  docs-use-cases:
    status: done
    references:
      docs:
        - ha-energy-planner-spec.md
  dynamic-devices:
    status: exempt
    comment: Energy Planner exposes one fixed service device per config entry and has no discovered device inventory that can appear dynamically.
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
        - custom_components/ha_energy_planner/coordinator.py
      tests:
        - scripts/docker-ha-smoke.sh
  entity-category:
    status: done
    comment: The three device control selectors remain in Controls; EV policy such as Keep charger on is central configuration, while the compact Armed, Current state, Next actions, and Plan calendar status surface remains primary. Decision summary, Plan health, Current load forecast, Planning duration, and Load forecast coverage score are categorized as diagnostics. Current state, Next actions, and the Plan calendar follow the device selectors and omit disabled control areas.
    references:
      code:
        - custom_components/ha_energy_planner/sensor.py
        - custom_components/ha_energy_planner/binary_sensor.py
        - custom_components/ha_energy_planner/switch.py
        - custom_components/ha_energy_planner/entity_registry_migration.py
        - custom_components/ha_energy_planner/button.py
        - custom_components/ha_energy_planner/calendar.py
      tests:
        - tests/test_switch_button.py
        - tests/test_ev_control_entities.py
        - tests/test_sensor.py
        - tests/test_calendar.py
  entity-device-class:
    status: done
    comment: Armed uses the running device class, Plan health uses enum, Current load forecast uses power in kW, and Planning duration uses duration in milliseconds; the consolidated text status sensors and read-only action calendar have no applicable device class.
    references:
      code:
        - custom_components/ha_energy_planner/sensor.py
        - custom_components/ha_energy_planner/binary_sensor.py
      tests:
        - tests/test_sensor.py
  entity-disabled-by-default:
    status: done
    comment: Advanced preflight, arm/disarm, replan, and resume buttons are disabled by default; fixed-duration pause buttons are retired in favour of the pause service, Run safety check always returns its pass/fail notification when enabled, Automatic control remains the sole master intent switch and stays on through post-startup recovery, Mode exposes that Recovery lifecycle, Armed exposes effective command authority, manual arming cannot bypass stale reviewed evidence, and the three visible device switches select its control areas.
    references:
      code:
        - custom_components/ha_energy_planner/sensor.py
        - custom_components/ha_energy_planner/binary_sensor.py
        - custom_components/ha_energy_planner/switch.py
        - custom_components/ha_energy_planner/button.py
  entity-translations:
    status: done
    comment: Planner entities, including the primary status/control surface and diagnostic decision, health, load-forecast, duration, and coverage sensors, use translation keys mirrored across bundled English translations; retired pause and Keep charger on entities are removed from registries.
    references:
      code:
        - custom_components/ha_energy_planner/strings.json
        - custom_components/ha_energy_planner/translations/en.json
      tests:
        - scripts/docker-ha-smoke.sh
  exception-translations:
    status: done
    comment: Config flows, explicit services, and entity actions use translation keys from strings.json and translations/en.json.
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/button.py
        - custom_components/ha_energy_planner/strings.json
        - custom_components/ha_energy_planner/translations/en.json
      tests:
        - tests/test_config_flow.py
        - tests/test_services.py
        - tests/test_switch_button.py
  icon-translations:
    status: done
    comment: Live custom icons are keyed by entity translation keys in icons.json. The quality validator rejects Python icons and invalid exemptions, and real Home Assistant icon loading is tested on the minimum, pinned baseline and stable releases.
    references:
      code:
        - custom_components/ha_energy_planner/icons.json
        - custom_components/ha_energy_planner/strings.json
      tests:
        - tests/test_ha_runtime.py
        - tests/scripts/test_validate_quality_scale.py
  reconfiguration-flow:
    status: done
    comment: Configure edits all input and policy sections with topology rebuilds; Reconfigure repairs missing legacy vehicle targets and retries migration without replacing the entry.
    references:
      code:
        - custom_components/ha_energy_planner/config_flow.py
      tests:
        - tests/test_config_flow.py
  repair-issues:
    status: exempt
    comment: Legacy target migration has an explicit Reconfigure recovery path. Runtime and storage failures use translated service errors, preflight evidence, and safe-state restoration; no separate Repairs flow is needed.
    references:
      code:
        - custom_components/ha_energy_planner/executor.py
      tests:
        - tests/test_executor.py
        - scripts/docker-ha-smoke.sh
  stale-devices:
    status: exempt
    comment: The integration has one config-entry device and no discovered device inventory to prune.
    references:
      code:
        - custom_components/ha_energy_planner/entity.py
  async-dependency:
    status: done
    comment: Integration I/O uses async Home Assistant services, async coordinators, executor-backed Recorder reads, off-event-loop Store serialization, and async HTTP export tooling; there are no synchronous third-party client dependencies.
    references:
      code:
        - custom_components/ha_energy_planner/coordinator.py
        - custom_components/ha_energy_planner/ai_advisor.py
  inject-websession:
    status: exempt
    comment: The integration does not maintain an aiohttp API client; optional AI calls are delegated to configured Home Assistant services.
    references:
      code:
        - custom_components/ha_energy_planner/ai_advisor.py
  strict-typing:
    status: done
    comment: Every integration module passes strict mypy against the pinned Home Assistant type surface; typed config-entry runtime data is used throughout, and the Docker and pull-request gates enforce the complete integration check.
    references:
      code:
        - custom_components/ha_energy_planner/type_defs.py
        - custom_components/ha_energy_planner/__init__.py
        - custom_components/ha_energy_planner/entity.py
        - pyproject.toml
        - scripts/docker-mypy.sh
        - scripts/docker-validate.sh
        - .github/workflows/quality-scale.yml
      tests:
        - tests/scripts/test_validate_quality_scale.py
